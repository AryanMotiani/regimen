# nfpm config for the lock agent's .deb and .rpm (see packaging/linux/build.sh).
# build.sh replaces ${VERSION}, ${GOARCH} and ${ROOT} before calling nfpm.
name: regimen-agent
arch: ${GOARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Regimen maintainers <noreply@github.com>
description: |
  Regimen lock agent. Enforces your Regimen blocks in every browser
  and app through the hosts file, and sets browser policies that turn off
  Secure DNS and private windows. Pairs with the Regimen browser extension.
vendor: Regimen (open source)
homepage: https://github.com/AryanMotiani/regimen
license: MIT

# The package was called focusgateway-agent before the rename (up to v1.2.0).
# Installing this one replaces it (deb Replaces and Conflicts, rpm Obsoletes),
# and `regimen-agent install` in postinstall moves its pairing and data over.
replaces:
  - focusgateway-agent
conflicts:
  - focusgateway-agent

contents:
  - src: ${ROOT}/agent/dist/regimen-agent-linux-${GOARCH}
    dst: /opt/regimen/regimen-agent
    file_info:
      mode: 0755
  - src: /opt/regimen/regimen-agent
    dst: /usr/bin/regimen-agent
    type: symlink
  - src: ${ROOT}/TROUBLESHOOTING.md
    dst: /usr/share/doc/regimen-agent/TROUBLESHOOTING.md
  - src: ${ROOT}/LICENSE
    dst: /usr/share/doc/regimen-agent/copyright

scripts:
  postinstall: ${ROOT}/packaging/linux/postinstall.sh
  preremove: ${ROOT}/packaging/linux/preremove.sh
