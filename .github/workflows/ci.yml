name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  unit:
    name: Unit tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: npm test

  agent:
    name: Lock agent (Go, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version-file: agent/go.mod, cache: false }
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "Run gofmt -w agent"; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  agent-build:
    name: Lock agent cross build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - uses: actions/setup-go@v5
        with: { go-version-file: agent/go.mod, cache: false }
      - name: Vet every target OS
        working-directory: agent
        run: |
          for os in windows darwin linux; do GOOS=$os go vet ./...; done
      - name: Build windows, darwin and linux for amd64 and arm64
        run: npm run agent:build | tee build.txt
      - name: Binary sizes
        run: |
          {
            echo '### Lock agent binaries'
            echo '```'
            grep ' MB ' build.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: agent-binaries
          path: agent/dist/
          retention-days: 7

  build:
    name: Build web app and extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Lint Firefox build (addons.mozilla.org rules)
        run: npm run lint:firefox
      - uses: actions/upload-artifact@v7
        with:
          name: extension-builds
          path: extension/dist/*.zip
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            apps/web/dist
            apps/web/dist-ext
            extension/dist/chromium
            extension/dist/e2e-chromium
          retention-days: 3

  e2e:
    name: End-to-end (extension in Chromium)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - uses: actions/setup-go@v5
        with: { go-version-file: agent/go.mod, cache: false }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: build-output }
      - name: Build the lock agent for the pairing test
        run: npm run agent:build -- --target linux/amd64
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
