<!doctype html>
<html lang="en" data-mode="game">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Regimen blocks distracting websites until your work is done. Tasks, habits and a lofi study room. Free and open source."
    />
    <meta name="theme-color" content="#1b1640" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="apple-touch-icon" href="./icon-512.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Regimen: study without the scroll</title>
    <!-- picks the first frame's colours from the last visit, before the stylesheet paints -->
    <script src="./boot.js" vite-ignore></script>
    <style>
      /* the splash until the first screen is ready: the logo on the page colour, shown only
         when loading takes a moment, so a fast load goes straight from blank to the page */
      .boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        opacity: 0;
        animation: boot-in 0.3s ease 0.35s forwards;
      }
      .boot-splash img {
        width: 48px;
        height: 48px;
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash {
          animation-duration: 0s;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-splash" aria-hidden="true"><img src="./logo.svg" alt="" /></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
