<!doctype html>
<!--
  Redirect for the old address https://aryanmotiani.github.io/focusgateway/.
  The project was renamed to Regimen, and GitHub Pages does not redirect a renamed
  repository's site. Publish this file as index.html of a repository named
  "focusgateway" (Pages on, branch master, folder /) to send old bookmarks and the
  pairing links of not yet updated lock agents to the new address. The part after
  # (the page and a pairing code) is kept, and it never reaches a server.
  See docs/DEPLOYMENT.md, "Old FocusGateway address".
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Regimen has moved</title>
    <link rel="canonical" href="https://aryanmotiani.github.io/regimen/" />
    <script>
      location.replace('https://aryanmotiani.github.io/regimen/' + location.hash)
    </script>
  </head>
  <body>
    <p>FocusGateway is now Regimen: <a href="https://aryanmotiani.github.io/regimen/">aryanmotiani.github.io/regimen</a>.</p>
  </body>
</html>
